<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Classic reinforcement learning loop</title>
  <desc id="desc">A classic reinforcement learning diagram showing an agent, environment, action, state, and reward feedback loop.</desc>
  <defs>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111111"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111111" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fafafa; }
      .panel { fill: #ffffff; stroke: #e5e5e5; stroke-width: 2; }
      .box { fill: #ffffff; stroke: #111111; stroke-width: 4; filter: url(#soft-shadow); }
      .label { fill: #111111; font: 650 48px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #111111; font: 500 34px Inter, ui-sans-serif, system-ui, sans-serif; }
      .formula { fill: #111111; font: 650 36px Georgia, serif; }
      .formula-small { fill: #111111; font: 650 30px Georgia, serif; }
      .arrow { fill: none; stroke: #111111; stroke-width: 6; marker-end: url(#arrow-dark); }
      .thin-arrow { fill: none; stroke: #111111; stroke-width: 4; marker-end: url(#arrow-dark); }
      .divider { stroke: #111111; stroke-width: 2; stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="675"/>
  <rect x="82" y="74" width="1036" height="526" rx="22" class="panel"/>

  <rect x="457" y="110" width="250" height="116" rx="18" class="box"/>
  <text x="582" y="184" text-anchor="middle" class="label">Agent</text>

  <rect x="440" y="405" width="384" height="116" rx="18" class="box"/>
  <text x="632" y="480" text-anchor="middle" class="label">Environment</text>

  <path class="arrow" d="M 707 168 H 995 V 463 H 824"/>
  <text x="1018" y="320" class="small">action</text>
  <text x="1018" y="362" class="formula">A<tspan baseline-shift="sub" font-size="22">t</tspan></text>

  <path class="arrow" d="M 440 463 H 168 V 168 H 457"/>
  <text x="126" y="310" text-anchor="middle" class="small">state</text>
  <text x="126" y="354" text-anchor="middle" class="formula">S<tspan baseline-shift="sub" font-size="22">t</tspan></text>

  <path class="thin-arrow" d="M 446 408 H 214 V 214 H 457"/>
  <text x="232" y="308" class="small">reward</text>
  <text x="238" y="352" class="formula">R<tspan baseline-shift="sub" font-size="22">t</tspan></text>

  <line x1="325" y1="311" x2="325" y2="429" class="divider"/>
  <path class="thin-arrow" d="M 440 429 H 342"/>
  <text x="360" y="391" class="formula-small">R<tspan baseline-shift="sub" font-size="18">t+1</tspan></text>
  <path class="thin-arrow" d="M 440 475 H 342"/>
  <text x="330" y="510" class="formula-small">S<tspan baseline-shift="sub" font-size="18">t+1</tspan></text>
</svg>
