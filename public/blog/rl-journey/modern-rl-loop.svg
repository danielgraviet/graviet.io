<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Modern language-model reinforcement learning loop</title>
  <desc id="desc">A modern version of the reinforcement learning loop with the agent, environment, action, state, and reward labels swapped for language-model systems.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#111111" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #fafafa; }
      .panel { fill: #ffffff; stroke: #e5e5e5; stroke-width: 2; }
      .box { fill: #eff6ff; stroke: #2563eb; stroke-width: 4; filter: url(#soft-shadow); }
      .state-box { fill: #fff7ed; stroke: #ea580c; stroke-width: 3; }
      .reward-box { fill: #f0fdf4; stroke: #16a34a; stroke-width: 3; }
      .label { fill: #111111; font: 650 44px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #111111; font: 500 30px Inter, ui-sans-serif, system-ui, sans-serif; }
      .tiny { fill: #5f5f5f; font: 500 21px Inter, ui-sans-serif, system-ui, sans-serif; }
      .formula { fill: #111111; font: 650 32px Georgia, serif; }
      .formula-small { fill: #111111; font: 650 27px Georgia, serif; }
      .arrow { fill: none; stroke: #2563eb; stroke-width: 6; marker-end: url(#arrow-blue); }
      .thin-arrow { fill: none; stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow-blue); }
      .divider { stroke: #2563eb; stroke-width: 2; stroke-dasharray: 10 10; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="675"/>
  <rect x="82" y="74" width="1036" height="526" rx="22" class="panel"/>

  <rect x="430" y="110" width="360" height="116" rx="18" class="box"/>
  <text x="610" y="164" text-anchor="middle" class="label">Model agent</text>
  <text x="610" y="196" text-anchor="middle" class="tiny">LLM, coding agent, robot policy</text>

  <rect x="430" y="405" width="494" height="116" rx="18" class="box"/>
  <text x="677" y="458" text-anchor="middle" class="label">Task environment</text>
  <text x="677" y="492" text-anchor="middle" class="tiny">tools, browser, tests, simulator</text>

  <path class="arrow" d="M 790 168 H 995 V 463 H 924"/>
  <rect x="980" y="286" width="140" height="82" rx="14" class="state-box"/>
  <text x="1050" y="318" text-anchor="middle" class="small">tool call</text>
  <text x="1050" y="354" text-anchor="middle" class="formula">A<tspan baseline-shift="sub" font-size="20">t</tspan></text>

  <path class="arrow" d="M 430 463 H 168 V 168 H 430"/>
  <rect x="88" y="277" width="156" height="94" rx="14" class="state-box"/>
  <text x="166" y="310" text-anchor="middle" class="small">context</text>
  <text x="166" y="348" text-anchor="middle" class="formula">C<tspan baseline-shift="sub" font-size="20">t</tspan></text>

  <path class="thin-arrow" d="M 436 408 H 214 V 214 H 430"/>
  <rect x="248" y="278" width="192" height="98" rx="14" class="reward-box"/>
  <text x="344" y="308" text-anchor="middle" class="small">feedback</text>
  <text x="344" y="340" text-anchor="middle" class="tiny">human, AI, verifier</text>
  <text x="344" y="369" text-anchor="middle" class="formula-small">R<tspan baseline-shift="sub" font-size="17">t</tspan></text>

  <line x1="374" y1="385" x2="374" y2="500" class="divider"/>
  <path class="thin-arrow" d="M 430 429 H 392"/>
  <text x="346" y="410" class="formula-small">R<tspan baseline-shift="sub" font-size="17">t+1</tspan></text>
  <path class="thin-arrow" d="M 430 475 H 392"/>
  <text x="346" y="510" class="formula-small">C<tspan baseline-shift="sub" font-size="17">t+1</tspan></text>
</svg>
